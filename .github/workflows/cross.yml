name: cross

# 交叉编译矩阵：六个目标组合都必须能编译通过。
#
# 注意：这里只能证明"可编译"。汇编 kernel 的正确性必须在对应架构的
# 原生 runner 上跑测试来证明（见 docs/Roadmap.md §11），
# 交叉编译通过不代表 SIMD 路径能被正确分派。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          check-latest: true

      - name: build
        run: go build ./...
